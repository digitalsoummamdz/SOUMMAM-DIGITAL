
name: Build Soummam Digital APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify required files
        run: |
          test -f lib/main.dart
          test -f assets/soummam_logo.jpeg
          test -f assets/mamzoudj_cerise.png

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.soummam.digital \
            build_app

      - name: Copy Dart code and assets
        run: |
          cp lib/main.dart build_app/lib/main.dart
          mkdir -p build_app/assets
          cp assets/soummam_logo.jpeg build_app/assets/
          cp assets/mamzoudj_cerise.png build_app/assets/

      - name: Configure Flutter assets
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          content = path.read_text()

          match = re.search(r"(?m)^flutter:[ \t]*(?:#.*)?$", content)
          if not match:
              raise SystemExit("ERROR: flutter section not found")

          start = match.end()
          next_section = re.search(
              r"(?m)^[A-Za-z_][A-Za-z0-9_]*:[ \t]*(?:#.*)?$",
              content[start:]
          )

          end = start + next_section.start() if next_section else len(content)
          section = content[start:end]

          section = re.sub(
              r"(?m)^  assets:[ \t]*\n(?:^    - .*\n)*",
              "",
              section
          )

          if not re.search(
              r"(?m)^  uses-material-design:[ \t]*true[ \t]*$",
              section
          ):
              section = "\n  uses-material-design: true\n" + section

          section = section.rstrip() + (
              "\n  assets:\n"
              "    - assets/soummam_logo.jpeg\n"
              "    - assets/mamzoudj_cerise.png\n"
          )

          content = content[:start] + section + content[end:]
          path.write_text(content)
          print("Flutter assets configured successfully.")
          print(path.read_text())
          PY

      - name: Resolve dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Check Dart syntax and format
        working-directory: build_app
        run: dart format lib/main.dart

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: soummam-digital-android
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
